name: QADAMROZGAR Auto Update
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: pip install -r requirements.txt
      - name: Run updater
        run: python agent_main.py --once
      - name: Save jobs
        run: |
          git config user.name "qadam-bot"
          git config user.email "bot@qadamrozgar.pk"
          git add jobs_db.json || echo "no file yet"
          git diff --staged --quiet || git commit -m "fresh jobs $(date -u)"
          git push
