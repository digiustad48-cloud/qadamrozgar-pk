name: QadamRozgar Agent

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run agent once
        run: python agent_main.py --once
        
      - name: Commit jobs_db.json
        run: |
          git config --global user.name 'QadamRozgar Bot'
          git config --global user.email 'bot@qadamrozgar.com'
          git add jobs_db.json
          git diff --staged --quiet || git commit -m "auto: update jobs"
          git push
