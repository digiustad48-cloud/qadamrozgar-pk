name: Real-Time Jobs Scraper - QadamRozgar

on:
  schedule:
    - cron: '*/15 * * * *'  # Har 15 min - different site rotation
  workflow_dispatch:  # Manual trigger

jobs:
  scrape-real-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install axios cheerio
        
      - name: Scrape Real Jobs - Rotation
        run: |
          HOUR=$(date +%H)
          MINUTE=$(date +%M)
          SOURCE_INDEX=$(( (HOUR * 4 + MINUTE / 15) % 4 ))
          echo "Current time: $(date) - Source index: $SOURCE_INDEX"
          
          if [ $SOURCE_INDEX -eq 0 ]; then
            echo "Scraping Indeed PK..."
            node scripts/scrape-indeed.js
          elif [ $SOURCE_INDEX -eq 1 ]; then
            echo "Scraping Ndeed.pk..."
            node scripts/scrape-ndeed.js
          elif [ $SOURCE_INDEX -eq 2 ]; then
            echo "Scraping BrightSpyre..."
            node scripts/scrape-brightspyre.js
          else
            echo "Scraping Govt portals..."
            node scripts/scrape-govt.js
          fi
          
      - name: Validate Real Jobs Only
        run: |
          node scripts/validate-real.js
          
      - name: Commit and Push jobs_db.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Real-Time Scraper"
          git add jobs_db.json govt-real-jobs.json || true
          git diff --staged --quiet || git commit -m "Real-time jobs update - $(date) - Source rotation"
          git push
