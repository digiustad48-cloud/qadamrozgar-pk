name: QadamRozgar Agent
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python agent_main.py --once
      - run: |
          git config --global user.name 'QadamRozgar Bot'
          git config --global user.email 'bot@qadamrozgar.com'
          git add jobs_db.json
          git diff --staged --quiet || git commit -m "auto: update jobs"
          git push
