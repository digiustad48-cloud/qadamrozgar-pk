name: QadamRozgar Agent

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qadamrozgar-jobs-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml || true
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
        
      - name: Run agent once
        run: |
          python agent_main.py --once || echo "Agent ran with fallback"
        
      - name: Commit safely
        run: |
          git config --global user.name 'QadamRozgar Bot'
          git config --global user.email 'bot@qadamrozgar.com'
          git pull --rebase origin main || true
          git add jobs_db.json || true
          git add jobs_db_1000.json || true
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "auto: update 1000 jobs $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase origin main && git push)
