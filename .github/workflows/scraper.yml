name: Real-Time Jobs Scraper - QadamRozgar

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape-real-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install requests

      - name: Run Multi-Source Real-Time Scraper (Python)
        run: |
          python naukrinow-pk-agent/scraper.py
          echo "Scraper finished - checking jobs_db.json"
          ls -lh jobs_db.json naukrinow-pk-agent/jobs_db.json || true
          cat jobs_db.json | head -20 || true

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Real-Time Scraper"
          git add jobs_db.json naukrinow-pk-agent/jobs_db.json rotation_index.txt || true
          git diff --staged --quiet || git commit -m "Real-time jobs update - $(date -u) - auto"
          git push
